table: subscription_addon
comment: Optional add-on features with separate pricing
columns:
  - name: id
    type: VARCHAR(20)
  - name: caption
    type: VARCHAR(80)
  - name: max_value
    type: BIGINT
  - name: is_active
    type: BOOLEAN
    default: "TRUE"
  # amount_minor is the price for one term_type unit in minor units.
  # Per-charge = this ÷ (term_type ÷ billing_cycle).
  - name: amount_minor
    type: BIGINT
  - name: currency
    type: CHAR(3)
    default: USD
  # billing_cycle (PERIOD_TYPE): how often charged. term_count × term_type: the
  # commitment. Same three-axis model as subscription_plan_price.
  - name: billing_cycle
    type: CHAR(1)
    default: M
  - name: term_count
    type: INTEGER
    default: "1"
  - name: term_type
    type: CHAR(1)
    default: M
  - name: description
    type: VARCHAR(255)
    nullable: true
primary_key: [id]
foreign_keys:
  - name: subscription_addon_currency
    columns: [currency]
    references:
      table: currency
      columns: [code]
checks:
  - name: chk_subscription_addon_billing_cycle
    expression: "billing_cycle IN ('A', 'Q', 'M', 'W', 'D', 'H', 'N', 'S', 'L')"
  - name: chk_subscription_addon_term_type
    expression: "term_type IN ('A', 'Q', 'M', 'W', 'D', 'H', 'N', 'S', 'L')"
