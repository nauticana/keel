table: invoice_line_payment
comment: |
  Durable allocation of one payment (or refund) to one invoice line in
  integer minor units. entry_type P allocates a collected payment
  (positive), R a refund (negative) — check-enforced. Currency is not
  repeated here: it is authoritative on the referenced payment/invoice.
  Consumers that recognize value per line (commission ledgers, revenue
  reporting, partial-refund processing) key on this row rather than
  reconstructing identity from payment + invoice + line columns.
order: 57
columns:
  - name: id
    type: BIGINT
  - name: payment_record_id
    type: BIGINT
  - name: invoice_id
    type: BIGINT
  - name: invoice_line_seq
    type: INTEGER
  - name: entry_type
    type: CHAR(1)
    default: P
  - name: amount_minor
    type: BIGINT
  - name: created_at
    type: TIMESTAMP
    default: CURRENT_TIMESTAMP
primary_key: [id]
sequence:
  name: invoice_line_payment_seq
  column: id
checks:
  - name: chk_inv_line_pmt_sign
    expression: "(entry_type = 'P' AND amount_minor > 0) OR (entry_type = 'R' AND amount_minor < 0)"
indexes:
  - name: idx_inv_line_pmt_payment
    columns: [payment_record_id]
  - name: idx_inv_line_pmt_line
    columns: [invoice_id, invoice_line_seq]
foreign_keys:
  # Invoice-consistent by construction: the payment FK carries invoice_id,
  # so an allocation can only target a line of the invoice its payment
  # settles — a payment for invoice A can never fund a line of invoice B,
  # and a payment with no invoice cannot be allocated at all.
  - name: payment_allocations
    columns: [payment_record_id, invoice_id]
    references:
      table: payment_record
      columns: [id, invoice_id]
  - name: invoice_line_allocations
    columns: [invoice_id, invoice_line_seq]
    references:
      table: invoice_line
      columns: [invoice_id, seq]
