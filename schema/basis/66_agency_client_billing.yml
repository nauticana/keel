table: agency_client_billing
comment: |
  Effective-dated referral (R) or wholesale (W) model per delegation. The
  partial unique index permits only one open row without a database extension;
  services close then insert atomically and validate historical intervals.
order: 66
columns:
  - name: id
    type: BIGINT
  - name: client_delegation_id
    type: BIGINT
  - name: billing_model
    type: CHAR(1)
  - name: effective_from
    type: TIMESTAMP
    default: CURRENT_TIMESTAMP
  - name: effective_to
    type: TIMESTAMP
    nullable: true
  - name: created_at
    type: TIMESTAMP
    default: CURRENT_TIMESTAMP
primary_key: [id]
sequence:
  name: agency_client_billing_seq
  column: id
checks:
  - name: chk_agency_client_billing_model
    expression: "billing_model IN ('R', 'W')"
  - name: chk_agency_client_billing_period
    expression: "effective_to IS NULL OR effective_to > effective_from"
indexes:
  - name: agency_client_billing_open_uq
    columns: [client_delegation_id]
    unique: true
    where: "effective_to IS NULL"
  - name: idx_agency_client_billing_period
    columns: [client_delegation_id, effective_from]
foreign_keys:
  - name: client_billing_delegation
    columns: [client_delegation_id]
    references:
      table: agency_client_delegation
      columns: [id]
    on_delete: CASCADE
