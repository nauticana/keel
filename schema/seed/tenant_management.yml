comment: Tenant Management seed data
order: 80
seeds:
  - table: constant_header
    columns: [id, caption]
    rows:
      - [domain_verification_method, Domain Verification Method]
  - table: constant_value
    columns: [constant_id, value, caption]
    rows:
      - [domain_verification_method, EC, Email code]
      - [domain_verification_method, VE, Verified email]
      - [domain_verification_method, GH, Google hosted domain]
      - [domain_verification_method, GM, Google mail server]
      - [domain_verification_method, HF, HTTP file]
      - [domain_verification_method, DT, DNS TXT record]
      - [domain_verification_method, GS, Google Search Console]
      - [domain_verification_method, GB, Google Business Profile]
      - [domain_verification_method, GW, Google Workspace admin]
      - [domain_verification_method, ME, Microsoft Entra admin]
  - table: constant_lookup
    columns: [constant_id, table_name, column_name]
    rows:
      - [domain_verification_method, partner_domain_verification, method]
      - [domain_verification_method, partner_domain_challenge, method]
  - table: user_account_policy
    columns: [id, policy_type, policy_value]
    rows:
      - [1, PASSWORD_EXPIRE_DAYS, 90]
      - [2, MIN_PASSWORD_LENGTH, 8]
      - [3, MIN_PASSWORD_UPPER, 1]
      - [4, MIN_PASSWORD_LOWER, 1]
      - [5, MIN_PASSWORD_DIGIT, 1]
      - [6, MIN_PASSWORD_SPECIAL, 0]
      - [7, MAX_ATTEMPTS, 5]
      - [8, AUTO_UNLOCK_MINUTES, 30]
      - [9, AUTO_LOGOUT_MINUTES, 5]
      - [10, SSO_REQUIRED, 0]
      - [11, SESSION_MAX_HOURS, 0]
  - table: application_menu_item
    columns: [display_order, filter_on_list, menu_id, item_id, rest_uri, caption]
    rows:
      - [75, true, setup, business_partners, business_partner, Business Partners]
      - [80, false, setup, partner_domains, partner_domain, Domains]
      - [240, false, setup, partner_addresses, partner_address, Addresses]
      - [250, false, setup, partner_users, partner_user, Partner Users]
  - table: column_display_attribute
    columns: [table_name, column_name, display_mode]
    rows:
      - [partner_user, begda, R]
      - [partner_domain, created_at, R]
      - [partner_domain_verification, verified_at, R]
      - [partner_domain_verification, last_checked_at, R]
  - table: foreign_key_lookup
    columns: [constraint_name, lookup_style, display_column]
    rows:
      - [partner_users, S, "*"]
      - [user_partners, S, "*"]
      - [partner_addresses, S, "*"]
      - [partner_address_countries, D, caption]
      - [partner_address_states, D, caption]
      - [partner_domains, S, "*"]
      - [partner_account_policies, S, "*"]
      - [partner_domain_verifications, S, "*"]
  - table: rest_api_header
    columns: [id, master_table]
    rows:
      - [business_partner, business_partner]
      - [partner_domain, partner_domain]
      - [partner_domain_verification, partner_domain_verification]
      - [partner_user, partner_user]
      - [partner_address, partner_address]
      - [partner_registration, business_partner]
  - table: rest_api_child
    columns: [api_id, seq, parent_seq, constraint_name]
    rows:
      - [business_partner, 1, 0, partner_users]
      - [business_partner, 2, 0, partner_addresses]
      - [business_partner, 3, 0, partner_domains]
      - [partner_registration, 1, 0, partner_users]
      - [partner_registration, 2, 0, partner_addresses]
      - [partner_registration, 3, 0, partner_domains]
      - [partner_domain, 1, 0, partner_domain_verifications]
  - table: authorization_object
    columns: [id, caption]
    rows:
      - [PARTNER_DOMAIN, Partner Domain Actions]
      - [PARTNER_USER, Partner User Actions]
  - table: authorization_object_action
    columns: [authorization_object_id, action, caption]
    rows:
      - [PARTNER_DOMAIN, VERIFY, Verify a partner domain]
      - [PARTNER_DOMAIN, CANCEL, Cancel a partner domain verification]
      - [PARTNER_USER, END, End a partner membership]
  - table: authorization_role_permission
