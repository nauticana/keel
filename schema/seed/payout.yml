      - [payout_provider, partner_payout_provider, provider]
      - [payout_instruction_status, payout_instruction, status]
      - [payout_provider, payout_instruction_leg, provider]
      - [payout_leg_status, payout_instruction_leg, status]
      - [payout_provider, payout_instruction_event, provider]
  - table: rest_api_header
    columns: [id, master_table]
    rows:
      - [user_bank_info, user_bank_info]
      - [payout_webhook_log, payout_webhook_log]
      - [partner_payout_provider, partner_payout_provider]
      - [payout_instruction, payout_instruction]
  - table: rest_api_child
    columns: [api_id, seq, parent_seq, constraint_name]
    rows:
      - [payout_instruction, 1, 0, payout_instruction_legs]
      - [payout_instruction, 2, 1, payout_leg_events]
  - table: application_menu
    columns: [display_order, id, caption]
    rows:
      - [95, payouts, Payouts]
  - table: application_menu_item
    columns: [display_order, filter_on_list, menu_id, item_id, rest_uri, caption]
    rows:
      - [10, true, payouts, user_bank_infos, user_bank_info, Bank Accounts]
      - [20, false, payouts, payout_webhook_logs, payout_webhook_log, Webhook Logs]
      - [30, false, payouts, partner_payout_providers, partner_payout_provider, Partner Payout Providers]
      - [40, true, payouts, payout_instructions, payout_instruction, Payout Instructions]
  - table: column_display_attribute
    columns: [table_name, column_name, display_mode]
    rows:
      - [user_bank_info, created_at, R]
      - [user_bank_info, updated_at, U]
      - [user_bank_info, superseded_at, R]
      - [user_bank_info, tax_id_encrypted, S]
      - [payout_webhook_log, received_at, R]
      - [partner_payout_provider, updated_at, U]
