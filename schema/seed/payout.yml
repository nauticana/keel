comment: Payout seed data
order: 150
seeds:
  - table: constant_header
    columns: [id, caption]
    rows:
      - [payout_provider, Payout Provider]
      - [tax_id_type, Tax ID Type]
      - [bank_info_status, Bank Info Status]
      - [payout_instruction_status, Payout Instruction Status]
      - [payout_leg_status, Payout Leg Status]
      - [payout_review_outcome, Payout Review Outcome]
  - table: constant_value
    columns: [constant_id, value, caption]
    rows:
      - [payout_provider, AW, Airwallex]
      - [payout_provider, SC, Stripe Connect]
      - [payout_provider, WI, Wise]
      - [tax_id_type, S, SIN (Canada)]
      - [tax_id_type, N, SSN or EIN (USA)]
      - [tax_id_type, E, EIN (USA business)]
      - [tax_id_type, V, VAT (EU)]
      - [tax_id_type, O, Other]
      - [bank_info_status, A, Active]
      - [bank_info_status, S, Superseded]
      - [payout_instruction_status, N, New]
      - [payout_instruction_status, D, Dispatching]
      - [payout_instruction_status, P, Pending]
      - [payout_instruction_status, S, Settled]
      - [payout_instruction_status, F, Failed]
      - [payout_instruction_status, V, Reversed]
      - [payout_instruction_status, X, Cancelled]
      - [payout_instruction_status, M, Manual review]
      - [payout_leg_status, D, Dispatching]
      - [payout_leg_status, P, Pending]
      - [payout_leg_status, S, Settled]
      - [payout_leg_status, F, Failed]
      - [payout_leg_status, R, Returned]
      - [payout_leg_status, V, Reversed]
      - [payout_review_outcome, paid, Confirmed paid]
      - [payout_review_outcome, failed, Confirmed failed]
      - [payout_review_outcome, returned, Confirmed returned]
      - [payout_review_outcome, reversed, Confirmed reversed]
  - table: constant_lookup
    columns: [constant_id, table_name, column_name]
    rows:
      - [payout_provider, user_bank_info, provider]
      - [tax_id_type, user_bank_info, tax_id_type]
      - [bank_info_status, user_bank_info, status]
      - [payout_provider, payout_webhook_log, provider]
      - [payout_provider, partner_payout_provider, provider]
      - [payout_instruction_status, payout_instruction, status]
      - [payout_provider, payout_instruction_leg, provider]
      - [payout_leg_status, payout_instruction_leg, status]
      - [payout_provider, payout_instruction_event, provider]
      - [payout_review_outcome, payout_instruction_resolution, outcome]
  - table: rest_api_header
    columns: [id, master_table]
    rows:
      - [user_bank_info, user_bank_info]
      - [payout_webhook_log, payout_webhook_log]
      - [partner_payout_provider, partner_payout_provider]
      - [payout_instruction, payout_instruction]
  - table: foreign_key_lookup
    columns: [constraint_name, lookup_style, display_column]
    rows:
      - [payout_instruction_legs, S, "*"]
      - [payout_leg_events, S, "*"]
      - [payout_leg_resolutions, S, "*"]
  - table: rest_api_child
    columns: [api_id, seq, parent_seq, constraint_name]
    rows:
      - [payout_instruction, 1, 0, payout_instruction_legs]
      - [payout_instruction, 2, 1, payout_leg_events]
      - [payout_instruction, 3, 1, payout_leg_resolutions]
  - table: authorization_object
    columns: [id, caption]
    rows:
      - [PAYOUT_INSTRUCTION, Payout Instruction Actions]
  - table: authorization_object_action
    columns: [authorization_object_id, action, caption]
    rows:
      - [PAYOUT_INSTRUCTION, CANCEL, Cancel]
      - [PAYOUT_INSTRUCTION, EXECUTE, Retry]
      - [PAYOUT_INSTRUCTION, RESOLVE, Resolve review]
  - table: table_action
    columns: [table_name, action_name, caption, icon, action_kind, record_specific, display_order]
    rows:
      - [payout_instruction, execute, Retry, replay, P, true, 10]
      - [payout_instruction, cancel, Cancel, cancel, P, true, 20]
      - [payout_instruction, resolve, Resolve review, fact_check, P, true, 30]
  - table: table_action_parameter
    columns: [table_name, action_name, seq, param_name, caption, data_type, required]
    rows:
      - [payout_instruction, resolve, 1, outcome, Confirmed outcome, string, true]
      - [payout_instruction, resolve, 2, note, Resolution note, string, true]
      - [payout_instruction, resolve, 3, provider_reference, Provider reference, string, true]
      - [payout_instruction, resolve, 4, reversed_minor, Reversed minor units, integer, false]
  - table: application_menu
    columns: [display_order, id, caption]
    rows:
      - [95, payouts, Payouts]
  - table: application_menu_item
    columns: [display_order, filter_on_list, menu_id, item_id, rest_uri, caption]
    rows:
      - [10, true, payouts, user_bank_infos, user_bank_info, Bank Accounts]
      - [20, false, payouts, payout_webhook_logs, payout_webhook_log, Webhook Logs]
      - [30, false, payouts, partner_payout_providers, partner_payout_provider, Partner Payout Providers]
      - [40, true, payouts, payout_instructions, payout_instruction, Payout Instructions]
  - table: column_display_attribute
    columns: [table_name, column_name, display_mode]
    rows:
      - [user_bank_info, created_at, R]
      - [user_bank_info, updated_at, U]
      - [user_bank_info, superseded_at, R]
      - [user_bank_info, tax_id_encrypted, S]
      - [payout_webhook_log, received_at, R]
      - [partner_payout_provider, updated_at, U]
      - [payout_instruction, created_at, R]
      - [payout_instruction, updated_at, U]
      - [payout_instruction_leg, created_at, R]
      - [payout_instruction_leg, updated_at, U]
      - [payout_instruction_event, applied_at, R]
      - [payout_instruction_resolution, resolved_at, R]
  - table: authorization_role_permission
    columns: [role_id, authorization_object_id, action, low_limit]
    rows:
      - [PAYMENT_ADMIN, PAGE, ACCESS, user_bank_infos]
      - [PAYMENT_ADMIN, TABLE, SELECT, user_bank_info]
      - [PAYMENT_ADMIN, TABLE, UPDATE, user_bank_info]
      - [PAYMENT_ADMIN, PAGE, ACCESS, payout_webhook_logs]
      - [PAYMENT_ADMIN, TABLE, SELECT, payout_webhook_log]
      - [PAYMENT_ADMIN, PAGE, ACCESS, partner_payout_providers]
      - [PAYMENT_ADMIN, TABLE, SELECT, partner_payout_provider]
      - [PAYMENT_ADMIN, TABLE, INSERT, partner_payout_provider]
      - [PAYMENT_ADMIN, TABLE, UPDATE, partner_payout_provider]
      - [PAYMENT_ADMIN, PAGE, ACCESS, payout_instructions]
      - [PAYMENT_ADMIN, TABLE, SELECT, payout_instruction]
      - [PAYMENT_ADMIN, PAYOUT_INSTRUCTION, CANCEL, payout_instruction]
      - [PAYMENT_ADMIN, PAYOUT_INSTRUCTION, EXECUTE, payout_instruction]
      - [PAYMENT_ADMIN, PAYOUT_INSTRUCTION, RESOLVE, payout_instruction]
