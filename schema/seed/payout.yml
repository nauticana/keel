comment: Payout seed data
order: 150
seeds:
  - table: constant_header
    columns: [id, caption]
    rows:
      - [payout_provider, Payout Provider]
      - [tax_id_type, Tax ID Type]
      - [bank_info_status, Bank Info Status]
      - [payout_instruction_status, Payout Instruction Status]
      - [payout_leg_status, Payout Leg Status]
  - table: constant_value
    columns: [constant_id, value, caption]
    rows:
      - [payout_provider, AW, Airwallex]
      - [payout_provider, SC, Stripe Connect]
      - [payout_provider, WI, Wise]
      - [tax_id_type, S, SIN (Canada)]
      - [tax_id_type, N, SSN or EIN (USA)]
      - [tax_id_type, E, EIN (USA business)]
      - [tax_id_type, V, VAT (EU)]
      - [tax_id_type, O, Other]
      - [bank_info_status, A, Active]
      - [bank_info_status, S, Superseded]
      - [payout_instruction_status, N, New]
      - [payout_instruction_status, D, Dispatching]
      - [payout_instruction_status, P, Pending]
      - [payout_instruction_status, S, Settled]
      - [payout_instruction_status, F, Failed]
      - [payout_instruction_status, V, Reversed]
      - [payout_instruction_status, X, Cancelled]
      - [payout_instruction_status, M, Manual review]
      - [payout_leg_status, D, Dispatching]
      - [payout_leg_status, P, Pending]
      - [payout_leg_status, S, Settled]
