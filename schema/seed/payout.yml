      - [PAYMENT_ADMIN, TABLE, UPDATE, partner_payout_provider]
      - [PAYMENT_ADMIN, PAGE, ACCESS, payout_instructions]
      - [PAYMENT_ADMIN, TABLE, SELECT, payout_instruction]
