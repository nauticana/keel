comment: Maker-checker approval seed data
order: 210
seeds:
  - table: constant_header
    columns: [id, caption]
    rows:
      - [approval_request_status, Approval Request Status]
      - [approval_event_type, Approval Event Type]
  - table: constant_value
    columns: [constant_id, value, caption]
    rows:
      - [approval_request_status, P, Pending]
      - [approval_request_status, A, Approved]
      - [approval_request_status, R, Rejected]
      - [approval_request_status, W, Withdrawn]
      - [approval_request_status, E, Expired]
      - [approval_event_type, S, Submitted]
      - [approval_event_type, A, Approved]
      - [approval_event_type, R, Rejected]
      - [approval_event_type, W, Withdrawn]
      - [approval_event_type, E, Expired]
  - table: constant_lookup
    columns: [constant_id, table_name, column_name]
    rows:
      - [approval_request_status, approval_request, status]
      - [approval_event_type, approval_event, event_type]
  - table: authorization_object
    columns: [id, caption]
    rows:
      - [APPROVAL_POLICY, Approval Policy Actions]
  - table: authorization_object_action
    columns: [authorization_object_id, action, caption]
    rows:
      - [APPROVAL_POLICY, CHANGE, Change a separation-of-duties policy]
  - table: authorization_role_permission
    columns: [role_id, authorization_object_id, action, low_limit]
    rows:
      - [PARTNER_ADMIN, APPROVAL_POLICY, CHANGE, approval_policy]
