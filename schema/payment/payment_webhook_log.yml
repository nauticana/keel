table: payment_webhook_log
comment: Raw inbound payment provider webhooks — idempotency + audit
columns:
  - name: id
    type: BIGINT
  - name: provider
    type: VARCHAR(30)
  - name: event_id
    type: VARCHAR(255)
  - name: event_type
    type: VARCHAR(100)
  - name: processing_status
    type: CHAR(1)
    default: R
  - name: error_message
    type: TEXT
    nullable: true
  - name: request_id
    type: TEXT
    nullable: true
  - name: raw_payload
    type: TEXT
    nullable: true
  - name: replay_attempts
    type: INTEGER
    default: 0
  - name: received_at
    type: TIMESTAMP
    default: CURRENT_TIMESTAMP
  - name: processed_at
    type: TIMESTAMP
    nullable: true
  - name: last_claimed_at
    type: TIMESTAMP
    nullable: true
primary_key: [id]
sequence:
  name: payment_webhook_log_seq
  column: id
indexes:
  - name: payment_webhook_log_uq
    columns: [provider, event_id]
    unique: true
  - name: idx_payment_webhook_replay
    columns: [processing_status, id]
checks:
  - name: chk_payment_webhook_status
    expression: "processing_status IN ('R', 'P', 'F', 'D', 'S', 'L')"
  - name: chk_payment_webhook_replay_attempts
    expression: "replay_attempts >= 0"
