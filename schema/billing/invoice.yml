table: invoice
comment: Billing invoices per partner (provider-issued or self-scheduled)
columns:
  - name: id
    type: BIGINT
  - name: partner_id
    type: BIGINT
  - name: invoice_number
    type: VARCHAR(30)
  - name: status
    type: CHAR(1)
    default: D
  - name: subtotal_minor
    type: BIGINT
  - name: tax_minor
    type: BIGINT
    default: "0"
  - name: total_minor
    type: BIGINT
    comment: charge amount in minor units of currency, no default — writers must supply it
  - name: currency
    type: CHAR(3)
  - name: issued_at
    type: TIMESTAMP
    default: CURRENT_TIMESTAMP
  - name: due_at
    type: TIMESTAMP
    nullable: true
  - name: paid_at
    type: TIMESTAMP
    nullable: true
  - name: pdf_storage_path
    type: VARCHAR(500)
    nullable: true
  - name: provider_invoice_id
    type: VARCHAR(255)
    nullable: true
  - name: provider_charge_id
    type: VARCHAR(255)
    nullable: true
  - name: attempt_count
    type: INTEGER
    default: "0"
  - name: next_attempt_at
    type: TIMESTAMP
    nullable: true
  - name: last_error
    type: TEXT
    nullable: true
primary_key: [id]
sequence:
  name: invoice_seq
  column: id
foreign_keys:
  - name: partner_invoices
    columns: [partner_id]
    references:
      table: business_partner
      columns: [id]
  - name: invoice_currency
    columns: [currency]
    references:
      table: currency
      columns: [code]
indexes:
  - name: idx_invoice_number
    columns: [invoice_number]
    unique: true
  - name: idx_invoice_partner
    columns: [partner_id]
  # FK targets for partner- and currency-consistent payment references.
  - name: invoice_id_partner_uq
    columns: [id, partner_id]
    unique: true
  - name: invoice_id_currency_uq
    columns: [id, currency]
    unique: true
