table: agency_payout_profile
comment: |
  Selects the exact active user_bank_info version used for an agency's
  commission payouts. The composite FK proves the destination belongs to the
  agency; user and provider are derived from user_bank_info, not duplicated.
columns:
  - name: agency_partner_id
    type: BIGINT
  - name: user_bank_info_id
    type: BIGINT
  - name: status
    type: CHAR(1)
    default: A
  - name: created_at
    type: TIMESTAMP
    default: CURRENT_TIMESTAMP
  - name: updated_at
    type: TIMESTAMP
    default: CURRENT_TIMESTAMP
primary_key: [agency_partner_id]
checks:
  - name: chk_agency_payout_profile_status
    expression: "status IN ('A', 'I')"
foreign_keys:
  - name: agencies_payout_profile
    columns: [agency_partner_id]
    references:
      table: agency_profile
      columns: [agency_partner_id]
    on_delete: CASCADE
  - name: agency_payout_profile_bank_info
    columns: [user_bank_info_id, agency_partner_id]
    references:
      table: user_bank_info
      columns: [id, partner_id]
