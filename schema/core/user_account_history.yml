table: user_account_history
comment: Login audit trail
columns:
  - name: user_id
    type: BIGINT
  - name: action_time
    type: TIMESTAMP
  - name: action_type
    type: CHAR(1)
  - name: status
    type: CHAR(1)
  - name: object_name
    type: VARCHAR(80)
    nullable: true
  - name: client_address
    type: VARCHAR(15)
    nullable: true
  - name: actor_id
    type: BIGINT
    nullable: true
    comment: The account that acted on user_id; NULL when the user acted
primary_key: [user_id, action_time]
foreign_keys:
  - name: user_historic_actions
    columns: [user_id]
    references:
      table: user_account
      columns: [id]
  - name: user_history_actors
    columns: [actor_id]
    references:
      table: user_account
      columns: [id]
checks:
  - name: chk_user_account_history_action_type
    expression: "action_type IN ('C', 'L', 'F', 'O', 'X', 'U', 'P', 'D', 'M', 'N', 'E', 'T', 'V')"
