table: foreign_key_lookup
comment: Controls FK display behavior in the UI
columns:
  - name: constraint_name
    type: VARCHAR(60)
  - name: lookup_style
    type: CHAR(1)
  - name: display_column
    type: VARCHAR(60)
primary_key: [constraint_name]
checks:
  - name: chk_foreign_key_lookup_lookup_style
    expression: "lookup_style IN ('D', 'S')"
