table: table_action_parameter
comment: |
  Input values a table action asks for besides the record key. The client
  posts them merged with the key; the action's handler validates them.
  lookup_table offers the rows of that table as choices.
columns:
  - name: table_name
    type: VARCHAR(80)
  - name: action_name
    type: VARCHAR(30)
  - name: seq
    type: INTEGER
  - name: param_name
    type: VARCHAR(30)
  - name: caption
    type: VARCHAR(80)
  - name: data_type
    type: VARCHAR(20)
    default: "string"
  - name: required
    type: BOOLEAN
    default: "FALSE"
  - name: lookup_table
    type: VARCHAR(80)
    nullable: true
primary_key: [table_name, action_name, seq]
foreign_keys:
  - name: table_action_parameters
    columns: [table_name, action_name]
    references:
      table: table_action
      columns: [table_name, action_name]
