table: rest_report_series
comment: Result columns a report's chart plots, in display order
columns:
  - name: report_id
    type: VARCHAR(80)
  - name: seq
    type: INTEGER
  - name: column_name
    type: VARCHAR(60)
primary_key: [report_id, seq]
indexes:
  - name: rest_report_series_column_uq
    columns: [report_id, column_name]
    unique: true
foreign_keys:
  - name: rest_report_chart_series
    columns: [report_id]
    references:
      table: rest_report_header
      columns: [id]
