table: user_refresh_token
comment: JWT refresh tokens
columns:
  - name: id
    type: BIGINT
  - name: user_id
    type: BIGINT
  - name: token_hash
    type: VARCHAR(128)
  - name: expires_at
    type: TIMESTAMP
  - name: session_started_at
    type: TIMESTAMP
    default: CURRENT_TIMESTAMP
    comment: Sign-in time of the session, carried through rotation
  - name: sign_in_method
    type: CHAR(1)
    nullable: true
    comment: How the session signed in; NULL is unknown
  - name: revoked_at
    type: TIMESTAMP
    nullable: true
  - name: created_at
    type: TIMESTAMP
    default: CURRENT_TIMESTAMP
primary_key: [id]
sequence:
  name: user_refresh_token_seq
  column: id
foreign_keys:
  - name: user_refresh_tokens
    columns: [user_id]
    references:
      table: user_account
      columns: [id]
indexes:
  - name: idx_refresh_token_hash
    columns: [token_hash]
