table: user_refresh_token
comment: JWT refresh tokens
columns:
  - name: id
    type: BIGINT
  - name: user_id
    type: BIGINT
  - name: token_hash
    type: VARCHAR(128)
  - name: expires_at
    type: TIMESTAMP
  - name: session_started_at
    type: TIMESTAMP
    default: CURRENT_TIMESTAMP
    comment: Sign-in time of the session, carried through rotation
  - name: session_max_seconds
    type: BIGINT
    nullable: true
    comment: Lifetime chosen at sign-in, carried through rotation; NULL renews without limit
  - name: sign_in_method
    type: CHAR(1)
    nullable: true
    comment: How the session signed in; NULL is unknown
  - name: session_id
    type: BIGINT
    comment: Sign-in session of the token, carried through rotation
  - name: user_agent
    type: VARCHAR(400)
    nullable: true
  - name: client_ip
    type: VARCHAR(45)
    nullable: true
  - name: device_hash
    type: CHAR(64)
    nullable: true
    comment: SHA-256 of the device cookie the session signed in from
  - name: revoked_at
    type: TIMESTAMP
    nullable: true
  - name: created_at
    type: TIMESTAMP
    default: CURRENT_TIMESTAMP
primary_key: [id]
sequence:
  name: user_refresh_token_seq
  column: id
foreign_keys:
  - name: user_refresh_tokens
    columns: [user_id]
    references:
      table: user_account
      columns: [id]
indexes:
  - name: idx_refresh_token_hash
    columns: [token_hash]
  - name: idx_refresh_token_session
    columns: [user_id, session_id]
