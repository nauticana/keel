table: authorization_role
comment: Authorization roles
columns:
  - name: id
    type: VARCHAR(30)
  - name: caption
    type: VARCHAR(80)
  - name: partner_scoped
    type: BOOLEAN
    default: "FALSE"
    comment: The role applies within the holder's partner; FALSE is a platform role
  - name: is_global
    type: BOOLEAN
    default: "FALSE"
    comment: The holder's row access spans partners; never a partner_scoped role
primary_key: [id]
checks:
  - name: authorization_role_global_ck
    expression: NOT (partner_scoped AND is_global)
indexes:
  - name: authorization_role_scope_uq
    columns: [id, partner_scoped]
    unique: true
