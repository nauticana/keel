table: payout_instruction_resolution
comment: Operator-confirmed outcomes for payout instructions in manual review.
columns:
  - name: id
    type: BIGINT
  - name: instruction_id
    type: BIGINT
  - name: leg_no
    type: INTEGER
  - name: outcome
    type: VARCHAR(20)
  - name: actor_id
    type: BIGINT
  - name: note
    type: VARCHAR(500)
  - name: provider_reference
    type: VARCHAR(255)
  - name: reversed_minor
    type: BIGINT
    default: "0"
  - name: resolved_at
    type: TIMESTAMP
    default: CURRENT_TIMESTAMP
primary_key: [id]
sequence:
  name: payout_instruction_resolution_seq
  column: id
checks:
  - name: chk_payout_instruction_resolution_outcome
    expression: "outcome IN ('paid', 'failed', 'returned', 'reversed')"
  - name: chk_payout_instruction_resolution_reversed
    expression: "(outcome = 'reversed' AND reversed_minor > 0) OR (outcome <> 'reversed' AND reversed_minor = 0)"
indexes:
  - name: idx_payout_instruction_resolution_leg
    columns: [instruction_id, leg_no, resolved_at]
foreign_keys:
  - name: payout_leg_resolutions
    columns: [instruction_id, leg_no]
    references:
      table: payout_instruction_leg
      columns: [instruction_id, leg_no]
  - name: payout_resolution_actor
    columns: [actor_id]
    references:
      table: user_account
      columns: [id]
