table: approval_policy
comment: |
  Separation-of-duties policy per review kind. object_type is an
  approval_request object type or a document_type id; partner_id NULL is the
  platform row, which a partner's own row overrides; without either, a second
  person is required. allow_single_person lets the maker decide their own
  request and the uploader review their own document. A change closes the
  open row (endda) and inserts the next one, so the policy in force at any
  time stays on record. A row turning separation off for an owner with a
  second administrator waits for that administrator's confirmation
  (confirmed_by) and is in force from begda only once confirmed.
columns:
  - name: id
    type: BIGINT
  - name: partner_id
    type: BIGINT
    nullable: true
  - name: object_type
    type: VARCHAR(50)
  - name: allow_single_person
    type: BOOLEAN
    default: false
  - name: changed_by
    type: BIGINT
  - name: confirmed_by
    type: BIGINT
    nullable: true
  - name: begda
    type: TIMESTAMP
    nullable: true
  - name: endda
    type: TIMESTAMP
    nullable: true
primary_key: [id]
sequence:
  name: approval_policy_seq
  column: id
indexes:
  - name: approval_policy_platform_uq
    columns: [object_type]
    unique: true
    where: "partner_id IS NULL AND endda IS NULL"
  - name: approval_policy_partner_uq
    columns: [partner_id, object_type]
    unique: true
    where: "endda IS NULL"
foreign_keys:
  - name: approval_policy_partner
    columns: [partner_id]
    references:
      table: business_partner
      columns: [id]
  - name: approval_policy_changed_by
    columns: [changed_by]
    references:
      table: user_account
      columns: [id]
  - name: approval_policy_confirmed_by
    columns: [confirmed_by]
    references:
      table: user_account
      columns: [id]
checks:
  - name: chk_approval_policy_confirmer
    expression: "confirmed_by IS NULL OR confirmed_by <> changed_by"
