table: document_type
comment: |
  A kind of partner document: which repository it is routed to, its upload
  limits, whether it starts pending review and whether a new approval
  supersedes the previous one (false for a type that is a set, where every
  approved document stands alone). Seeded by each application.
columns:
  - name: id
    type: VARCHAR(30)
  - name: caption
    type: VARCHAR(80)
  - name: contrep_id
    type: VARCHAR(30)
  - name: max_bytes
    type: BIGINT
  - name: media_types
    type: VARCHAR(500)
  - name: requires_review
    type: BOOLEAN
    default: false
  - name: supersedes
    type: BOOLEAN
    default: true
primary_key: [id]
foreign_keys:
  - name: document_type_repository
    columns: [contrep_id]
    references:
      table: content_repository
      columns: [id]
